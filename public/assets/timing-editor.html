<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>填詞 Timing Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
  :root{
    --paper:#ECE7C8; --paper-hi:#F4EFD2; --ink:#2C2C2A; --ink-soft:#5F5E5A;
    --muted:#9A9577; --rule:#DAD3A8; --accent:#E24B4A; --accent-soft:#F4C9C5;
    --done:#B4B2A9; --green:#7FA66A; --section:#9A7BC8; --line:#E0A0A0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#C9B89B; color:var(--ink);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .topbar{
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:var(--paper); border-bottom:1px solid var(--rule); flex:none;
  }
  .topbar h1{font-size:14px; margin:0; font-weight:600; letter-spacing:.5px}
  .topbar .sub{font-size:12px; color:var(--ink-soft)}
  .topbar .spacer{flex:1}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:6px}
  .btn{padding:7px 12px; font-size:13px; background:var(--paper-hi); border:1px solid var(--rule); color:var(--ink)}
  .btn:hover{background:#fff}
  .btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn:disabled{opacity:.4; cursor:not-allowed}

  .main{display:flex; flex:1; min-height:0}
  .left{width:46%; max-width:560px; display:flex; flex-direction:column; border-right:1px solid var(--rule); background:#1c1c1a}
  #player{flex:none; aspect-ratio:16/9; width:100%; background:#000}
  .pcontrols{padding:12px 14px; color:#eee; display:flex; flex-direction:column; gap:10px}
  .timecode{font-variant-numeric:tabular-nums; font-size:28px; font-weight:600; letter-spacing:1px; text-align:center}
  .timecode small{font-size:14px; color:#999; font-weight:400}
  .scrub{display:flex; align-items:center; gap:8px}
  .scrub input[type=range]{flex:1}
  .scrub .t{font-size:11px; color:#aaa; font-variant-numeric:tabular-nums; min-width:38px}
  .prow{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
  .prow .btn{background:#2c2c2a; color:#eee; border-color:#3a3a38}
  .prow .btn:hover{background:#3a3a38}
  .rate{display:flex; align-items:center; gap:6px; font-size:12px; color:#bbb; justify-content:center}
  .hintbar{font-size:12px; color:#bbb; text-align:center; line-height:1.6; padding-top:4px; border-top:1px solid #333}
  kbd{background:#333; border:1px solid #555; border-bottom-width:2px; border-radius:4px; padding:1px 6px; font-size:11px; font-family:inherit; color:#fff}

  .right{flex:1; display:flex; flex-direction:column; min-width:0; background:var(--paper)}
  .lyrics{
    flex:1; overflow-y:auto; padding:8px 0 40vh;
    background:var(--paper);
    background-image:repeating-linear-gradient(var(--paper) 0px, var(--paper) 37px, var(--rule) 37px, var(--rule) 38px);
  }
  .row{
    display:flex; align-items:center; gap:10px; padding:0 18px; height:38px;
    font-family:'LXGW WenKai',sans-serif; position:relative; scroll-margin:120px;
  }
  .row .tc{
    font-family:ui-monospace,monospace; font-size:12px; color:var(--muted);
    min-width:54px; text-align:right; flex:none; cursor:pointer;
  }
  .row .tc.set{color:var(--accent)}
  .row .tx{font-size:17px; color:#3A3A37; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:1px}
  .row.section .tx{font-size:11px; color:var(--section); letter-spacing:2px; font-family:ui-monospace,monospace}
  .row.blank{height:19px}
  .row.cursor{background:rgba(226,75,74,.10)}
  .row.cursor::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .row.next-untimed .tx{font-weight:600; color:var(--ink)}
  .row .nudge{display:none; gap:2px; margin-left:auto; flex:none}
  .row.cursor .nudge{display:flex}
  .row .nudge button{font-size:11px; padding:2px 6px; background:var(--paper-hi); border:1px solid var(--rule); color:var(--ink-soft)}
  .row .play-from{opacity:0; font-size:11px; padding:2px 7px; background:transparent; border:1px solid var(--rule); color:var(--ink-soft); flex:none}
  .row:hover .play-from{opacity:1}

  .statusbar{
    flex:none; display:flex; align-items:center; gap:14px; padding:8px 16px;
    background:var(--paper-hi); border-top:1px solid var(--rule); font-size:12px; color:var(--ink-soft)
  }
  .statusbar .prog{flex:1; height:5px; background:var(--rule); border-radius:3px; overflow:hidden}
  .statusbar .prog>span{display:block; height:100%; background:var(--green)}
  .pill{background:var(--paper); border:1px solid var(--rule); border-radius:20px; padding:2px 10px}

  dialog{border:none; border-radius:10px; padding:0; max-width:680px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,.4)}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  .dlg-h{padding:14px 18px; border-bottom:1px solid var(--rule); display:flex; align-items:center; background:var(--paper)}
  .dlg-h h2{margin:0; font-size:14px}
  .dlg-h .spacer{flex:1}
  .dlg-b{padding:0}
  .dlg-b textarea{width:100%; height:340px; border:none; padding:14px 18px; font-family:ui-monospace,monospace; font-size:12px; resize:none; outline:none; color:var(--ink)}
  .dlg-f{padding:12px 18px; border-top:1px solid var(--rule); display:flex; gap:8px; justify-content:flex-end; background:var(--paper)}
  .seg{display:flex; border:1px solid var(--rule); border-radius:6px; overflow:hidden}
  .seg button{padding:6px 12px; font-size:12px; background:var(--paper-hi); border:none; border-right:1px solid var(--rule); color:var(--ink-soft)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent); color:#fff}
  @media (max-width:760px){ .main{flex-direction:column} .left{width:100%; max-width:none; max-height:46vh} }
</style>
</head>
<body>
  <div class="topbar">
    <h1>填詞 Timing Editor</h1>
    <span class="sub" id="songName">— no song loaded —</span>
    <div class="spacer"></div>
    <button class="btn" id="loadBtn">Load data</button>
    <button class="btn primary" id="exportBtn">Export JS</button>
  </div>

  <div class="main">
    <div class="left">
      <div id="player"></div>
      <div class="pcontrols">
        <div class="timecode"><span id="tcNow">0:00.0</span> <small>/ <span id="tcDur">0:00</span></small></div>
        <div class="scrub">
          <span class="t" id="scrubA">0:00</span>
          <input type="range" id="scrub" min="0" max="1000" value="0">
          <span class="t" id="scrubB">0:00</span>
        </div>
        <div class="prow">
          <button class="btn" id="back5">« 5s</button>
          <button class="btn" id="playPause">▶ Play</button>
          <button class="btn" id="fwd5">5s »</button>
        </div>
        <div class="rate">
          speed
          <div class="seg" id="rateSeg">
            <button data-r="0.5">0.5×</button>
            <button data-r="0.75">0.75×</button>
            <button data-r="1" class="on">1×</button>
          </div>
        </div>
        <div class="hintbar">
          <kbd>Space</kbd> stamp current line &amp; advance &nbsp;·&nbsp;
          <kbd>←</kbd>/<kbd>→</kbd> nudge ±0.1s &nbsp;·&nbsp;
          <kbd>↑</kbd>/<kbd>↓</kbd> move cursor<br>
          <kbd>R</kbd> replay from cursor &nbsp;·&nbsp; <kbd>Backspace</kbd> clear line &nbsp;·&nbsp; <kbd>K</kbd> play/pause
        </div>
      </div>
    </div>

    <div class="right">
      <div class="lyrics" id="lyrics"></div>
      <div class="statusbar">
        <span class="pill" id="countPill">0 / 0 timed</span>
        <div class="prog"><span id="progBar" style="width:0%"></span></div>
        <span id="cursorInfo">line 1</span>
      </div>
    </div>
  </div>

  <dialog id="loadDlg">
    <div class="dlg-h"><h2>Paste song data</h2><div class="spacer"></div></div>
    <div class="dlg-b">
      <textarea id="loadTa" placeholder="Paste a song object (the { id: ... } block) or just the pages array. Both work."></textarea>
    </div>
    <div class="dlg-f">
      <button class="btn" id="loadCancel">Cancel</button>
      <button class="btn primary" id="loadOk">Load</button>
    </div>
  </dialog>

  <dialog id="exportDlg">
    <div class="dlg-h"><h2>Timed data</h2><div class="spacer"></div><button class="btn" id="copyBtn">Copy</button></div>
    <div class="dlg-b"><textarea id="exportTa" readonly></textarea></div>
    <div class="dlg-f"><button class="btn" id="exportClose">Close</button></div>
  </dialog>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ---------- sample data (the hottogo example, trimmed) so the tool works on open ----------
const SAMPLE = {
  id:'hottogo', title:'學跳高', originalTitle:'HOT TO GO!', originalArtist:'Chappell Roan',
  youtubeId:'GJAt8bqW00E',
  pages:[[
    {text:'[Verse 1]',type:'section',time:null},
    {text:'你說有愛侶可以不管一切',type:'lyric',time:17.4},
    {text:'我聽進半句轉眼擺好姿勢',type:'lyric',time:20.5},
    {text:'聽說你興趣恐怕這般心意',type:'lyric',time:null},
    {text:'你永遠抗拒所以高舉真摯',type:'lyric',time:null},
    {text:'',type:'blank',time:null},
    {text:'[Refrain]',type:'section',time:null},
    {text:'喜歡要寫種情詩',type:'lyric',time:null},
    {text:'跳高叫囂多無恥',type:'lyric',time:null},
  ]]
};

// ---------- state ----------
let song = null;       // {meta, flat:[{...item, page, idx}], }
let player = null, ready=false, dur=0, raf=null;
let cursor = 0;        // index into timeable rows (lyric rows only navigable, but we store flat index)
let playing=false;

const $ = s=>document.querySelector(s);
const lyricsEl = $('#lyrics');

// flatten pages -> rows with refs
function loadSong(obj){
  // accept either a full song object or a bare pages array
  let meta={}, pages=null;
  if(Array.isArray(obj)){ pages=obj; }
  else { meta=obj; pages=obj.pages; }
  if(!pages){ alert('Could not find a pages array in that data.'); return; }
  const flat=[];
  pages.forEach((pg,pi)=>pg.forEach((it)=>{
    flat.push(Object.assign({}, it, {page:pi}));
  }));
  song={meta, pages, flat};
  $('#songName').textContent = (meta.title||'song') + (meta.originalTitle? ' · '+meta.originalTitle : '');
  if(meta.youtubeId && ready) loadVideo(meta.youtubeId);
  cursor = firstTimeable();
  render();
}
function isTimeable(it){ return it.type==='lyric'; }
function firstTimeable(){ return song.flat.findIndex(isTimeable); }
function nextTimeable(from){
  for(let i=from+1;i<song.flat.length;i++) if(isTimeable(song.flat[i])) return i;
  return -1;
}
function prevTimeable(from){
  for(let i=from-1;i>=0;i--) if(isTimeable(song.flat[i])) return i;
  return -1;
}
function firstUntimedFrom(from){
  for(let i=from;i<song.flat.length;i++) if(isTimeable(song.flat[i]) && song.flat[i].time==null) return i;
  return -1;
}

function fmt(t){ if(t==null||isNaN(t)) return '—'; const m=Math.floor(t/60), s=(t%60); return m+':'+s.toFixed(1).padStart(4,'0'); }
function fmtShort(t){ const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); }

function render(){
  lyricsEl.innerHTML='';
  song.flat.forEach((it,i)=>{
    const row=document.createElement('div');
    row.className='row '+(it.type==='section'?'section':it.type==='blank'?'blank':'');
    if(i===cursor) row.classList.add('cursor');
    if(it.type==='blank'){ lyricsEl.appendChild(row); return; }

    if(it.type==='lyric'){
      const tc=document.createElement('span');
      tc.className='tc'+(it.time!=null?' set':'');
      tc.textContent=it.time!=null?fmt(it.time):'—';
      tc.title='click to seek here';
      tc.onclick=()=>{ if(it.time!=null) seek(it.time); };
      row.appendChild(tc);
    } else {
      const tc=document.createElement('span'); tc.className='tc'; tc.textContent=''; row.appendChild(tc);
    }
    const tx=document.createElement('span'); tx.className='tx'; tx.textContent=it.text; row.appendChild(tx);

    if(it.type==='lyric'){
      const pf=document.createElement('button'); pf.className='play-from'; pf.textContent='▶ here';
      pf.onclick=()=>{ if(it.time!=null){ seek(it.time); play(); } else { setCursor(i);} };
      row.appendChild(pf);

      const nudge=document.createElement('span'); nudge.className='nudge';
      const mk=(lbl,d)=>{ const b=document.createElement('button'); b.textContent=lbl; b.onclick=()=>nudgeLine(i,d); return b; };
      nudge.appendChild(mk('−0.1',-0.1)); nudge.appendChild(mk('+0.1',0.1));
      row.appendChild(nudge);
    }
    row.onclick=(e)=>{ if(e.target.closest('button')) return; setCursor(i); };
    lyricsEl.appendChild(row);
  });
  // mark next untimed
  const u=firstUntimedFrom(0);
  if(u>=0) lyricsEl.children[u]?.classList.add('next-untimed');
  updateStatus();
  scrollToCursor();
}

function updateStatus(){
  const lyr=song.flat.filter(isTimeable);
  const done=lyr.filter(x=>x.time!=null).length;
  $('#countPill').textContent=`${done} / ${lyr.length} timed`;
  $('#progBar').style.width=(lyr.length?done/lyr.length*100:0)+'%';
  const cinfo = song.flat[cursor];
  $('#cursorInfo').textContent = cinfo? (cinfo.type==='lyric'? `“${cinfo.text.slice(0,12)}${cinfo.text.length>12?'…':''}”` : cinfo.text) : '';
}

function setCursor(i){
  // snap to nearest timeable
  if(!isTimeable(song.flat[i])){ const n=nextTimeable(i-1); if(n>=0) i=n; else return; }
  cursor=i; render();
}
function scrollToCursor(){
  const el=lyricsEl.children[cursor];
  if(el) el.scrollIntoView({block:'center', behavior:'smooth'});
}

// ---------- stamping ----------
function stampCursor(){
  if(!ready||!song) return;
  const it=song.flat[cursor];
  if(!it||!isTimeable(it)) return;
  it.time = round1(player.getCurrentTime());
  // also write back into the original pages structure
  syncBack(cursor);
  const n=nextTimeable(cursor);
  if(n>=0) cursor=n;
  render();
}
function round1(t){ return Math.round(t*10)/10; }
function nudgeLine(i,d){
  const it=song.flat[i]; if(it.time==null) it.time=round1(player.getCurrentTime());
  it.time=Math.max(0, round1(it.time+d)); syncBack(i); render();
}
function clearCursor(){
  const it=song.flat[cursor]; if(isTimeable(it)){ it.time=null; syncBack(cursor); render(); }
}
function replayFromCursor(){
  const it=song.flat[cursor];
  let t = it.time!=null? it.time : (()=>{ const p=prevTimeable(cursor); return p>=0&&song.flat[p].time!=null?song.flat[p].time:0; })();
  seek(Math.max(0,t-0.3)); play();
}
// keep song.pages in sync with flat edits (so export is clean)
function syncBack(flatIdx){
  // rebuild pages from flat each export instead; cheaper to just flag. We'll rebuild on export.
}

// ---------- player ----------
function onYouTubeIframeAPIReady(){
  player=new YT.Player('player',{
    height:'100%', width:'100%', videoId: SAMPLE.youtubeId,
    playerVars:{playsinline:1, rel:0, modestbranding:1},
    events:{ onReady:()=>{ ready=true; dur=player.getDuration(); $('#tcDur').textContent=fmtShort(dur||0); tick(); },
             onStateChange:(e)=>{ playing = e.data===YT.PlayerState.PLAYING; $('#playPause').textContent=playing?'❚❚ Pause':'▶ Play'; } }
  });
}
function loadVideo(id){ player.loadVideoById(id); player.pauseVideo(); setTimeout(()=>{dur=player.getDuration(); $('#tcDur').textContent=fmtShort(dur||0);},800); }
function play(){ player&&player.playVideo(); }
function pause(){ player&&player.pauseVideo(); }
function togglePlay(){ playing?pause():play(); }
function seek(t){ player&&player.seekTo(Math.max(0,t),true); }
function tick(){
  if(ready){
    const t=player.getCurrentTime()||0;
    $('#tcNow').textContent=fmt(t);
    if(dur){ $('#scrub').value=Math.round(t/dur*1000); $('#scrubA').textContent=fmtShort(t); $('#scrubB').textContent=fmtShort(dur); }
  }
  raf=requestAnimationFrame(tick);
}

// ---------- export ----------
function buildExport(){
  // rebuild pages from flat
  const pages=[]; let cur=null, curPage=-1;
  song.flat.forEach(it=>{
    if(it.page!==curPage){ cur=[]; pages.push(cur); curPage=it.page; }
    const o={text:it.text, type:it.type, time: it.time==null?null:it.time};
    cur.push(o);
  });
  const m=song.meta;
  const head = m.id ? `  {\n    id: '${m.id}',\n    title: ${JSON.stringify(m.title||'')},\n    originalTitle: ${JSON.stringify(m.originalTitle||'')},\n    originalArtist: ${JSON.stringify(m.originalArtist||'')},\n    youtubeId: '${m.youtubeId||''}',\n    pages: ` : '  ';
  const body = JSON.stringify(pages, null, 6)
     .replace(/"text":/g,'text:').replace(/"type":/g,'type:').replace(/"time":/g,'time:')
     .replace(/"([^"]*)"/g, (mm,p1)=> p1.includes("'")? `"${p1}"` : `'${p1}'`)
     .replace(/'null'/g,'null').replace(/: 'true'/g,': true').replace(/: 'false'/g,': false');
  return m.id ? head+body+'\n  },' : body;
}

// ---------- keyboard ----------
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]')) return;
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  switch(e.key){
    case ' ': e.preventDefault(); stampCursor(); break;
    case 'ArrowLeft': e.preventDefault(); nudgeLine(cursor,-0.1); break;
    case 'ArrowRight': e.preventDefault(); nudgeLine(cursor,0.1); break;
    case 'ArrowUp': e.preventDefault(); { const p=prevTimeable(cursor); if(p>=0) setCursor(p);} break;
    case 'ArrowDown': e.preventDefault(); { const n=nextTimeable(cursor); if(n>=0) setCursor(n);} break;
    case 'r': case 'R': e.preventDefault(); replayFromCursor(); break;
    case 'k': case 'K': e.preventDefault(); togglePlay(); break;
    case 'Backspace': e.preventDefault(); clearCursor(); break;
  }
});

// ---------- ui wiring ----------
$('#playPause').onclick=togglePlay;
$('#back5').onclick=()=>seek((player.getCurrentTime()||0)-5);
$('#fwd5').onclick=()=>seek((player.getCurrentTime()||0)+5);
$('#scrub').oninput=e=>{ if(dur) seek(e.target.value/1000*dur); };
document.querySelectorAll('#rateSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#rateSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); player.setPlaybackRate(parseFloat(b.dataset.r));
});
$('#loadBtn').onclick=()=>{ $('#loadTa').value=''; $('#loadDlg').showModal(); };
$('#loadCancel').onclick=()=>$('#loadDlg').close();
$('#loadOk').onclick=()=>{
  const raw=$('#loadTa').value.trim(); if(!raw){ $('#loadDlg').close(); return; }
  try{
    let txt=raw.replace(/,\s*$/,''); // strip trailing comma
    // wrap bare object/array for eval
    const val=(new Function('return ('+txt+')'))();
    loadSong(val); $('#loadDlg').close();
  }catch(err){ alert('Parse error: '+err.message); }
};
$('#exportBtn').onclick=()=>{ if(!song){alert('Load a song first.');return;} $('#exportTa').value=buildExport(); $('#exportDlg').showModal(); };
$('#exportClose').onclick=()=>$('#exportDlg').close();
$('#copyBtn').onclick=()=>{ $('#exportTa').select(); document.execCommand('copy'); $('#copyBtn').textContent='Copied!'; setTimeout(()=>$('#copyBtn').textContent='Copy',1200); };

// boot with sample
window.addEventListener('load',()=>{ loadSong(SAMPLE); });
</script>
</body>
</html>
